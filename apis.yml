apis:
- name: Abi API
  description: >-
    Partner REST API for managing user accounts, subscriptions, text consultations, form-based
    prescriptions, Health Navigator AI conversations and outbound webhooks. Resource-oriented URLs,
    JSON responses, conventional HTTP status codes. Authentication is a partner API key exchanged
    at POST /partner/authorization/token for a one-hour Bearer access_token and a 24-hour
    refresh_token. Three regional bases are published: https://client-api.abi.ai (primary),
    https://ape1.api.abi.ai (Hong Kong) and https://client-api.abiglobalhealth.cn (China).
  humanURL: https://docs.abi.ai/
  baseURL: https://client-api.abi.ai
