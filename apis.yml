aid: abiglobalhealth
name: Abi Global Health
description: >-
  Abi Global Health is an AI-native healthcare navigation, virtual care orchestration and clinical
  cost management platform founded in Dublin, Ireland in 2016. Abi sells to health insurers,
  employee benefits providers, TPAs, assistance companies, digital health organisations,
  pharmaceutical companies and public health programmes rather than direct to consumers, and
  delivers text, voice and video consultations, mental-health screening, form-based prescriptions
  and the Abi Navigator AI triage assistant through chat apps, an embeddable widget, a web app and
  a partner REST API. The Abi API (documented at docs.abi.ai, base https://client-api.abi.ai with
  Hong Kong and mainland-China regional bases) covers users, subscriptions, consultations,
  prescriptions, Health Navigator conversations and outbound webhooks, and is gated behind a
  partner account and an issued API key.
